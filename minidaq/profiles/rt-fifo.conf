# MiniDAQ real-time profile: pinning plus SCHED_FIFO for the three busy stages
# (the book's 4-CPU VM). Never put two SCHED_FIFO threads that poll on the same
# CPU: the higher-priority one starves the other (see Chapter 4). Pair and
# write stay SCHED_OTHER on CPU 0 with the operating system.
# On the acquisition PC: isolate CPUs 1-3 (isolcpus=1-3 nohz_full=1-3) and move
# interrupts away from them, then one stage per isolated core.
lock_memory = true
prefault_stack_kib = 256
source.cpu = 1
source.policy = fifo
source.priority = 80
decode.cpu = 2
decode.policy = fifo
decode.priority = 70
sort.cpu = 3
sort.policy = fifo
sort.priority = 70
pair.cpu = 0
write.cpu = 0
