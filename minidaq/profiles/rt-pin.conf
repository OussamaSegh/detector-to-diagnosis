# MiniDAQ real-time profile: pinning only (the book's 4-CPU VM).
# CPU 0 keeps the operating system, interrupts, and the two cheapest stages
# (pair and write); source, decode and sort get one CPU each.
lock_memory = true
prefault_stack_kib = 256
source.cpu = 1
decode.cpu = 2
sort.cpu = 3
pair.cpu = 0
write.cpu = 0
