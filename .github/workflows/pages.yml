# The book's download page on GitHub Pages: the EPUB and the PDF in three page formats (print,
# phone, Kindle Paperwhite), of the book and of the solutions manual, built from the commit by
# book/build.sh and listed by book/tools/site.py with their SHA-256. Every listing in the book is
# included from the repository, so the page is rebuilt on every push to main.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Pandoc, XeLaTeX and the fonts
        # About 300 MB. A slow mirror once took over 50 minutes for it, so the step has its own
        # limit, and a download that stalls is retried instead of waited for.
        timeout-minutes: 30
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-extra \
            texlive-latex-recommended texlive-fonts-recommended texlive-pictures latexmk \
            texlive-plain-generic lmodern tex-gyre fonts-texgyre fonts-texgyre-math fonts-inconsolata \
            graphviz librsvg2-bin poppler-utils
      - name: Build the EPUBs and the print PDFs
        run: |
          export NEUROLF_DATE="$(git log -1 --format=%cs)"
          book/build.sh all both
      - name: Build the phone PDFs
        run: NEUROLF_DATE="$(git log -1 --format=%cs)" NEUROLF_PDF_FORMAT=phone book/build.sh pdf both
      - name: Build the Kindle Paperwhite PDFs
        run: NEUROLF_DATE="$(git log -1 --format=%cs)" NEUROLF_PDF_FORMAT=kindle book/build.sh pdf both
      - name: Write the download page
        run: python3 book/tools/site.py site "$(tr -d '[:space:]' < VERSION)" book/build/out/*.epub book/build/out/*.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
