# SPDX-License-Identifier: MIT
# Creates the labels listed in .github/labels.txt that the repository does not have yet. The
# sessions that write this project cannot create labels through the API, so a label is added to
# the list and this workflow makes it with the repository's own token. It only adds labels.
name: labels
on:
  push:
    branches: [main]
    paths: [.github/labels.txt, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  labels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create the missing labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh label list --repo "$GITHUB_REPOSITORY" --limit 500 --json name --jq '.[].name')"
          grep -v '^#' .github/labels.txt | grep -v '^[[:space:]]*$' | while IFS=$'\t' read -r name color description; do
            if grep -qxF "$name" <<<"$existing"; then
              echo "label $name exists"
            else
              gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description"
              echo "label $name created"
            fi
          done
