# Performance regression gate (Chapter 5, rebuilt in Chapter 20).
#
# Chapter 5's gate compared a run with a baseline recorded on one dedicated machine, and this
# workflow waited for a self-hosted runner that did not exist: it never started a job
# (MDQ-PR-014). On a shared cloud runner a stored baseline means nothing, because the next job
# may run on another CPU model. So this job builds the commit before the change and the change
# itself, and runs both on the same runner, interleaved (tools/perf_ab.sh): the comparison is
# A/B on one machine, not against a number from another. The baseline gate on the reference
# machine still runs before every release (tools/release_checks.sh, CAPA-0004).
name: perf
on:
  push:
    branches: [main]
    paths: ["minidaq/**", "benchmarks/**", "cmake/**", "CMakeLists.txt", "CMakePresets.json"]
  pull_request:
    paths: ["minidaq/**", "benchmarks/**", "cmake/**", "CMakeLists.txt", "CMakePresets.json"]
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to compare with (default: the parent of the head commit)"
        required: false

permissions:
  contents: read

jobs:
  perf-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
      - name: Choose the base commit
        id: base
        run: |
          base="${{ github.event.inputs.base || github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "base $(git log -1 --format='%h %s' "$base")"
          echo "head $(git log -1 --format='%h %s' HEAD)"
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: Build both
        run: |
          git worktree add --detach ../base "${{ steps.base.outputs.sha }}"
          for d in . ../base; do
            (cd "$d" && cmake --preset release -DMINIDAQ_BUILD_TESTS=OFF -DMINIDAQ_BUILD_EXERCISES=OFF >/dev/null &&
              cmake --build --preset release)
          done
      - name: Compare, interleaved on this runner
        run: tools/perf_ab.sh ../base/build/release build/release perf-ab 5 1
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-${{ github.sha }}
          path: perf-ab/
