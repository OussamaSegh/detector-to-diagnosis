# MiniDAQ CI (Chapter 1 baseline; Chapter 7 adds static analysis, fuzzing, the
# hardened build and the SBOM; Chapter 20 grows it into the full regulated pipeline).
name: ci
on:
  push:
    branches: [main]
    tags: ["ch*", "book-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, clang-release, gcc-cxx23, hardened, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE starter

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-tidy-18 cppcheck
      - name: Configure (for compile_commands.json)
        run: cmake --preset clang-release
      - name: clang-tidy and cppcheck
        run: tools/static_analysis.sh build/clang-release

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Build fuzzers
        run: |
          cmake --preset fuzz -DMINIDAQ_FUZZ_SMOKE_SECONDS=60
          cmake --build --preset fuzz
      - name: Fuzz each target for 60 s from the seed corpus
        run: ctest --preset fuzz -L fuzz
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            build/fuzz/**/crash-*
            build/fuzz/**/leak-*
            build/fuzz/**/timeout-*

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate the CycloneDX SBOM
        run: |
          python3 -m pip install --user "jsonschema>=4.18"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" tools/make_sbom.py --validate -o minidaq.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: minidaq.cdx.json
