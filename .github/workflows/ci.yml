# MiniDAQ CI (Chapter 1 baseline; Chapter 7 adds static analysis, fuzzing, the hardened build
# and the SBOM; Chapter 17 the vulnerability scan; Chapter 20 the tool versions, the
# reproducibility check and the release package). Its gates and their reasons are listed in the
# development plan, section 6; tools/gate_selftest.py (workflow gates.yml) shows each can fail.
name: ci
on:
  push:
    branches: [main]
    tags: ["ch*", "book-v*"]
  workflow_dispatch:  # tags.yml starts it for the release tags it creates
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, clang-release, gcc-cxx23, hardened, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v5
        with:
          # docs.changes checks that each implemented change request's commits exist.
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev libssl-dev
      - name: Tune the network stack as the acquisition PC is installed (ADR 0009)
        # The system test plan's environment (section 3): Ubuntu's default rmem_max is too small
        # for a burst of readout packets, and the kernel would drop them (MDQ-PR-020).
        run: sudo sysctl -w net.core.rmem_max=4194304
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        # The output of a failed test is the only record of why it failed (MDQ-PR-020).
        run: ctest --preset ${{ matrix.preset }} -LE starter --output-on-failure

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-tidy-18 cppcheck libssl-dev
      - name: Configure (for compile_commands.json)
        run: cmake --preset clang-release
      - name: clang-tidy and cppcheck
        run: tools/static_analysis.sh build/clang-release
      - name: Tool versions as recorded in the tool list
        # Chapter 20: a new compiler or analyzer on the runner is a change to the tools; this
        # step fails until the tool list (docs/regulatory/verification/tools.json) records it.
        run: python3 tools/check_tools.py . --check --environment

  reproducible-build:
    # Chapter 20: the shipped build, made twice from two checkouts in different directories,
    # gives the same product archive byte for byte. repro.txt keeps the programs' SHA-256, to
    # compare with the same commit built elsewhere.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
      - name: Build twice and compare
        run: tools/repro_check.sh repro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-${{ github.sha }}
          path: repro/

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev libssl-dev
      - name: Build fuzzers
        run: |
          cmake --preset fuzz -DMINIDAQ_FUZZ_SMOKE_SECONDS=60
          cmake --build --preset fuzz
      - name: Fuzz each target for 60 s from the seed corpus
        run: ctest --preset fuzz -L fuzz
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            build/fuzz/**/crash-*
            build/fuzz/**/leak-*
            build/fuzz/**/timeout-*

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Generate and validate the CycloneDX SBOM
        run: |
          python3 -m pip install --user "jsonschema>=4.18"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" tools/make_sbom.py --validate -o minidaq.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: minidaq.cdx.json

  vulnerability-scan:
    # Chapter 17: match the SBOM against vulnerability databases and apply the triage decisions
    # (threat-model.md, section 8). Grype is pinned; its database is downloaded at each run, so
    # a new advisory fails the next run until someone decides on it.
    needs: sbom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - uses: actions/setup-go@v5
        with:
          # Grype 0.120.1 needs Go 1.26.8 or newer.
          go-version: "1.26"
      - name: Install Grype
        run: go install github.com/anchore/grype/cmd/grype@v0.120.1
      - name: Scan the SBOM
        run: |
          "$(go env GOPATH)/bin/grype" version
          "$(go env GOPATH)/bin/grype" sbom:minidaq.cdx.json --distro ubuntu:24.04 -o json --file scan.json
          "$(go env GOPATH)/bin/grype" sbom:minidaq.cdx.json --distro ubuntu:24.04 -o table
      - name: Check that the scan can find something
        # A scan that matches nothing also reports nothing. The original noble OpenSSL package
        # (3.0.13-0ubuntu3) has advisories fixed in later updates; if Grype finds none for it,
        # the SBOM's identifiers no longer match the database and an empty scan proves nothing.
        run: |
          sed 's/3\.0\.13-0ubuntu3\.[0-9]*/3.0.13-0ubuntu3/g' minidaq.cdx.json > control.cdx.json
          "$(go env GOPATH)/bin/grype" sbom:control.cdx.json --distro ubuntu:24.04 -o json --file control.json
          python3 -c 'import json, sys; n = len(json.load(open("control.json"))["matches"]); print(f"control scan with libssl3t64 3.0.13-0ubuntu3: {n} finding(s)"); sys.exit(n == 0)'
      - name: Apply the triage decisions
        run: python3 tools/vuln_triage.py scan.json docs/regulatory/security/vulnerability-triage.json --vex minidaq.vex.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-scan
          path: |
            scan.json
            minidaq.vex.json

  document-control:
    # Chapter 16: a controlled document that changed since the last release has a new version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check document versions against the last release
        run: |
          # The last release tag, or else the commit its release record names: a clone can lack
          # the tags, and without one this check was skipped on every run (MDQ-PR-030).
          last="$(git describe --tags --abbrev=0 --match 'book-v*' HEAD 2>/dev/null || true)"
          if [ -z "$last" ]; then
            record="$(ls docs/regulatory/releases/*.md | sort -V | tail -n 1)"
            last="$(grep -oE -m 1 'commit [0-9a-f]{40}' "$record" | cut -d' ' -f2)"
            echo "no release tag in this clone: comparing with the commit of $record, $last"
          fi
          test -n "$last" && git cat-file -e "$last^{commit}"
          python3 tools/design_file.py . --check --since "$last"

  release-package:
    # Chapter 20: for a release tag, the product archive of tools/release_bundle.py. Its SHA-256
    # must equal the one of the archive made on the reference machine from the same commit; the
    # evidence archive is made there, by tools/release_checks.sh.
    if: startsWith(github.ref, 'refs/tags/book-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
      - name: Build the shipped programs and package them
        run: |
          cmake --preset hardened -DMINIDAQ_BUILD_TESTS=OFF -DMINIDAQ_BUILD_BENCHMARKS=OFF -DMINIDAQ_BUILD_EXERCISES=OFF
          cmake --build --preset hardened --target minidaq_server minidaq_ctl
          python3 tools/release_bundle.py make build/hardened package
          python3 tools/release_bundle.py verify package/*.tar
          sha256sum package/*.tar
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: package/
